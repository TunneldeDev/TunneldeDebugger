name: Feature request
description: Propose a focused improvement to the development or acceptance workflow.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before proposing a UI or implementation. Requests should identify the affected run mode and platform when relevant.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult, unsafe or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like, including alternatives you considered.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Workbench UI
        - Browser scenarios
        - Desktop or Tauri host
        - Native mock or real-service instances
        - Test discovery and runners
        - Acceptance records or screenshots
        - Build, packaging or CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Expected value
      description: Who benefits, and how would you verify that the change works?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples, upstream constraints or related issues.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This request describes a user problem rather than only an implementation detail.
          required: true
